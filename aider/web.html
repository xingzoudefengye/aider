<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aider 管理</title><style>
:root{color-scheme:dark;--bg:#0f1011;--panel:#1b1d1f;--panel2:#242629;--line:#303439;--text:#f3f4f6;--muted:#9ca3af;--cyan:#22d3ee;--green:#22c55e;--purple:#a78bfa;--red:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);background:#20262d;color:var(--text);border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{border-color:#59636e;background:#2b323a}button.primary{background:#f5f5f5;color:#111;border-color:#f5f5f5;font-weight:650}button.danger{color:var(--red)}button.link{border:0;background:transparent;color:var(--cyan);padding:4px 7px}input,select{background:#101214;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}input:focus,select:focus{outline:2px solid #155e75;border-color:var(--cyan)}
.app{display:flex;min-height:100vh}.side{width:248px;flex:none;padding:34px 18px;border-right:1px solid #25282b;background:#111213}.brand{font-size:29px;font-weight:750;letter-spacing:-.5px;margin:4px 14px 58px}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;text-align:left;color:var(--muted);font-size:17px;padding:15px 18px}.nav button.active{background:#292b2e;color:#fff}.nav-icon{display:inline-block;width:28px;color:var(--cyan)}
.main{min-width:0;flex:1}.topbar{height:92px;border-bottom:1px solid #25282b;padding:30px 38px;display:flex;align-items:center;justify-content:space-between}.topbar h1{margin:0;font-size:29px;font-weight:650}.topbar h1 small{font-size:13px;color:var(--muted);font-weight:400;margin-left:10px}.content{padding:24px 38px 56px;max-width:1440px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:24px}.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}.hidden{display:none!important}.notice{padding:12px 14px;border:1px solid #155e75;background:#082f3b;border-radius:8px;color:#a5f3fc;margin-bottom:16px}
.provider-card{background:var(--panel);border:1px solid #25282b;border-radius:14px;padding:22px 24px;margin:0 0 16px}.provider-head{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:18px}.provider-head h2{font-size:17px;margin:0}.provider-head .count{color:var(--muted)}.spacer{flex:1}.badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:6px;font-size:12px;background:#30264c;color:var(--purple)}.badge.green{background:#103b2a;color:#86efac}.badge.blue{background:#123a6a;color:#93c5fd}.badge.gray{background:#263039;color:#cbd5e1}.provider-info{display:grid;grid-template-columns:minmax(220px,1.8fr) minmax(170px,.8fr) minmax(180px,.8fr);gap:16px;padding:18px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field-value{background:#111315;border:1px solid #202327;border-radius:8px;padding:10px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.model-row{display:flex;align-items:center;gap:10px;border-top:1px solid #2a2d30;padding:17px 0}.model-name{font-weight:650;min-width:145px}.model-tags{display:flex;gap:6px;flex-wrap:wrap}.model-actions{display:flex;align-items:center;gap:7px;margin-left:auto}.model-actions button{padding:7px 10px;font-size:12px}.toggle{width:39px;height:22px;border-radius:20px;padding:2px;background:#374151;border:0}.toggle.on{background:var(--green)}.toggle i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}.toggle.on i{transform:translateX(17px)}.add-model{width:100%;border-style:dashed;background:transparent;color:var(--cyan);margin-top:5px}
.session-layout{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(420px,1.15fr);border:1px solid #25282b;border-radius:12px;overflow:hidden;min-height:560px}.session-list{background:#151719;padding:18px}.session-item{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid transparent;border-radius:10px;padding:15px;margin-bottom:10px;cursor:pointer}.session-item:hover,.session-item.selected{border-color:#0ea5a5}.session-item main{min-width:0;flex:1}.session-title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-path{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-detail{padding:28px;background:#111213;overflow:auto}.session-detail h2{margin:0 0 5px;font-size:23px}.detail-head{display:flex;align-items:flex-start;gap:12px}.detail-head h2{flex:1}.command{display:flex;gap:10px;align-items:flex-start;background:#202224;border:1px solid var(--line);border-radius:9px;padding:14px;margin:22px 0;white-space:pre-wrap;word-break:break-word}.command code{flex:1;color:#d1d5db}.message{background:var(--panel);border-radius:12px;padding:15px;margin:14px 0;white-space:pre-wrap;word-break:break-word}.message-label{color:var(--cyan);font-weight:650;margin-bottom:8px}.empty{padding:38px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px}.modal-card{width:min(560px,100%);background:#202224;border:1px solid var(--line);border-radius:12px;padding:24px}.form-grid{display:grid;gap:12px}.form-grid>label{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:12px;min-width:0}.form-grid>label>input:not([type="checkbox"]),.form-grid>label>select{width:100%;min-width:0}.form-grid>label:has(input[type="checkbox"]){display:flex;align-items:center;gap:8px}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
@media(max-width:900px){.side{width:190px}.content{padding:20px}.provider-info{grid-template-columns:1fr}.session-layout{grid-template-columns:1fr}.session-detail{min-height:400px}}@media(max-width:640px){.app{display:block}.side{width:auto;padding:14px;border-right:0;border-bottom:1px solid #25282b}.brand{margin:4px 8px 14px;font-size:24px}.nav{display:flex}.nav button{flex:1;padding:10px;font-size:14px}.topbar{height:auto;padding:20px;gap:12px}.topbar h1{font-size:23px}.content{padding:16px}.provider-card{padding:16px}.provider-head{flex-wrap:wrap}.model-row{align-items:flex-start;flex-wrap:wrap}.model-actions{margin-left:0;width:100%}.toolbar{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Aider</div><nav class="nav"><button id="nav-models" class="active" onclick="showPage('models')"><span class="nav-icon">⚙</span>模型设置</button><button id="nav-sessions" onclick="showPage('sessions')"><span class="nav-icon">◌</span>会话管理</button></nav></aside><main class="main"><header class="topbar"><h1 id="page-title">模型列表<small id="page-subtitle">配置已加载</small></h1><div><button onclick="reloadPage()">↻ 重新加载</button><button class="primary" onclick="openProviderForm()">＋ 添加模型</button></div></header><section id="models-page" class="content"><div id="notice" class="notice hidden"></div><div class="toolbar"><div class="filters"><span class="muted">选择供应商：</span><select id="provider-filter" onchange="renderProviders()"><option value="">全部供应商</option></select></div><button class="primary" onclick="openProviderForm()">添加供应商</button></div><div id="providers"></div></section><section id="sessions-page" class="content hidden"><div class="toolbar"><div class="filters"><input id="search" placeholder="搜索会话" onkeydown="if(event.key==='Enter')loadSessions()"><button onclick="loadSessions()">搜索</button><select id="archived" onchange="loadSessions()"><option value="">全部</option><option value="false">未归档</option><option value="true">已归档</option></select></div><button onclick="loadSessions()">↻ 重新加载</button></div><div class="session-layout"><div class="session-list"><div id="session-count" class="muted" style="margin:0 0 14px">会话列表</div><div id="sessions"></div></div><article id="detail" class="session-detail"><div class="empty">选择一个会话查看详情</div></article></div></section></main></div><div id="modal" class="modal hidden"><div class="modal-card"><h2 id="modal-title">添加模型</h2><form id="provider-form" class="form-grid"><input type="hidden" name="id"><label>名称<input name="name" placeholder="Provider 名称" required></label><label>模型<input name="model" placeholder="模型 ID" required></label><label>API 协议<select name="protocol"><option value="openai-chat">OpenAI Chat Completions</option><option value="anthropic">Anthropic Messages</option><option value="openai-responses">OpenAI Responses</option></select></label><label>Base URL<input name="api_base" placeholder="https://api.example.com/v1"></label><label>API Key 环境变量<input name="api_key_env" placeholder="OPENAI_API_KEY"></label><label><input type="checkbox" name="is_default"> 设为默认模型</label><div class="form-actions"><button type="button" onclick="closeModal()">取消</button><button class="primary">保存</button></div></form></div></div>
<script>
const token='__AIDER_TOKEN__',headers={'Authorization':'Bearer '+token};let providers=[],sessions=[],currentSession=null;
function setupProviderForm(){const form=document.querySelector('#provider-form');form.elements.name?.closest('label')?.remove();document.querySelector('.toolbar > .primary')?.remove();const env=form.elements.api_key_env;env.parentElement.hidden=true;const key=document.createElement('input');key.type='password';key.name='api_key';key.placeholder='直接填写 API Key';key.autocomplete='new-password';const label=document.createElement('label');label.append('API Key',key);env.parentElement.after(label)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idArg=id=>encodeURIComponent(id),decodeId=id=>decodeURIComponent(id);const protocolName=p=>({"openai-chat":"OpenAI Chat","anthropic":"Anthropic Messages","openai-responses":"OpenAI Responses"}[p]||p);
async function api(url,options={}){const response=await fetch(url,{...options,headers:{...headers,...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||`HTTP ${response.status}`);return data}
function showNotice(message){const el=document.querySelector('#notice');el.textContent=message;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3500)}
function showPage(page){const models=page==='models';document.querySelector('#models-page').classList.toggle('hidden',!models);document.querySelector('#sessions-page').classList.toggle('hidden',models);document.querySelector('#nav-models').classList.toggle('active',models);document.querySelector('#nav-sessions').classList.toggle('active',!models);document.querySelector('#page-title').firstChild.textContent=models?'模型列表':'共享会话';document.querySelector('#page-subtitle').textContent=models?'配置已加载':'';document.querySelector('.topbar .primary').classList.toggle('hidden',!models);if(!models)loadSessions()}
function reloadPage(){if(document.querySelector('#models-page').classList.contains('hidden'))loadSessions();else loadProviders()}
async function loadProviders(){try{providers=await api('/api/providers');const filter=document.querySelector('#provider-filter');const value=filter.value;filter.innerHTML='<option value="">全部供应商</option>'+[...new Set(providers.map(p=>p.provider_id||p.name))].map(id=>`<option value="${esc(id)}">${esc(id)}</option>`).join('');filter.value=value;renderProviders()}catch(error){showNotice(error.message)}}
function renderProviders(){const filter=document.querySelector('#provider-filter').value;const visible=providers.filter(p=>!filter||(p.provider_id||p.name)===filter);const groups={};visible.forEach(p=>(groups[p.name]??=[]).push(p));const html=Object.entries(groups).map(([name,items])=>{const first=items[0];return `<section class="provider-card"><div class="provider-head"><div style="display:flex;align-items:center;gap:8px"><h2>${esc(name)}</h2><button class="link" style="font-size:18px;line-height:1;padding:3px 5px;color:#9ca3af" title="编辑供应商" aria-label="编辑供应商" onclick="openProviderEditor('${idArg(first.id)}')"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="m16 3 5 5-12 12-6 1 1-6Z"></path><path d="m14 5 5 5"></path></svg></button></div><span class="badge green">${items.some(p=>p.enabled!==false)?'已启用':'已禁用'}</span><span class="count">${items.length} 个模型</span><span class="spacer"></span></div>${items.map(renderModel).join('')}<button class="add-model" onclick="openProviderForm({source_provider_id:'${idArg(first.id)}'})">＋ 添加模型（当前供应商）</button></section>`}).join('');document.querySelector('#providers').innerHTML=html||'<div class="empty">暂无 Provider 配置</div>'}
function renderModel(p){const encoded=idArg(p.id);return `<div class="model-row"><div class="model-name">${esc(p.model)}</div><span class="badge">${esc(protocolName(p.protocol))}</span><div class="model-tags"><span class="badge blue">模型配置</span>${p.enabled===false?'<span class="badge gray">已禁用</span>':'<span class="badge green">已启用</span>'}</div><div class="model-actions"><button onclick="testProvider('${encoded}')">测试连接</button><button onclick="editProvider('${encoded}')">编辑</button><button class="danger" onclick="deleteProvider('${encoded}')">删除</button></div></div>`}
async function testProvider(encoded){try{const result=await api('/api/providers/'+decodeId(encoded)+'/test',{method:'POST'});showNotice(result.ok?'连接成功':'连接失败：'+(result.error||'未知错误'))}catch(error){showNotice(error.message)}}
async function deleteProvider(encoded){if(!confirm('确定删除这个 Provider 吗？'))return;try{await api('/api/providers/'+decodeId(encoded),{method:'DELETE'});await loadProviders()}catch(error){showNotice(error.message)}}
function setupProviderEditor(){const modal=document.createElement('div');modal.id='provider-edit-modal';modal.className='modal hidden';modal.innerHTML='<div class="modal-card"><h2>编辑供应商</h2><p class="muted">修改此供应商下模型共用的配置</p><form id="provider-edit-form" class="form-grid"><input type="hidden" name="group"><label>供应商名称<input name="name" required placeholder="例如 my-api"></label><label>Base URL<input name="api_base" placeholder="https://api.example.com/v1"></label><label>API 协议<select name="protocol"><option value="openai-chat">OpenAI Chat Completions</option><option value="anthropic">Anthropic Messages</option><option value="openai-responses">OpenAI Responses</option></select></label><label>API Key<input type="password" name="api_key" autocomplete="new-password" placeholder="已配置，留空则保持不变"></label><div class="form-actions"><button type="button" onclick="closeProviderEditor()">取消</button><button class="primary">保存供应商</button></div></form></div>';document.body.append(modal);modal.querySelector('form').onsubmit=saveProviderEditor}
function openProviderEditor(encoded){const provider=providers.find(item=>String(item.id)===decodeId(encoded));if(!provider)return;const form=document.querySelector('#provider-edit-form');form.reset();form.elements.group.value=provider.name||'';form.elements.name.value=provider.name||'';form.elements.api_base.value=provider.api_base||'';form.elements.protocol.value=provider.protocol||'openai-chat';form.elements.api_key.value='';document.querySelector('#provider-edit-modal').classList.remove('hidden')}
function closeProviderEditor(){document.querySelector('#provider-edit-modal').classList.add('hidden')}
async function saveProviderEditor(event){event.preventDefault();const form=event.target;const current=form.elements.group.value;const name=form.elements.name.value.trim();if(!name){showNotice('供应商名称不能为空');return}const targets=providers.filter(item=>item.name===current);if(!targets.length){showNotice('供应商不存在');return}const data={name,api_base:form.elements.api_base.value.trim()||null,protocol:form.elements.protocol.value};const apiKey=form.elements.api_key.value.trim();if(apiKey)data.api_key=apiKey;try{await Promise.all(targets.map(item=>api('/api/providers/'+encodeURIComponent(item.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})));closeProviderEditor();await loadProviders();showNotice('供应商信息已更新')}catch(error){showNotice(error.message)}}
function openProviderForm(value={}){const form=document.querySelector('#provider-form');form.reset();let sourceInput=form.elements.source_provider_id;if(!sourceInput){sourceInput=document.createElement('input');sourceInput.type='hidden';sourceInput.name='source_provider_id';form.prepend(sourceInput)}const id=value.id||'';const sourceId=value.source_provider_id?decodeId(value.source_provider_id):'';const source=sourceId?providers.find(item=>String(item.id)===sourceId):null;sourceInput.value=sourceId;document.querySelector('[name=id]').value=id;for(const name of ['model','protocol','api_base','api_key_env'])if(value[name]!=null&&form.elements[name])form.elements[name].value=value[name];if(source&&!id){form.elements.protocol.value=source.protocol||'openai-chat';form.elements.api_base.value=source.api_base||'';form.elements.api_key_env.value=source.api_key_env||'';if(form.elements.api_key)form.elements.api_key.value=source.has_api_key?(source.has_api_key_env&&source.api_key_env?'环境变量：'+source.api_key_env:'已配置 · 不回显'):'未配置'}else if(form.elements.api_key)form.elements.api_key.value='';form.elements.is_default.checked=!!value.is_default;const inherited=!!source&&!id;for(const name of ['protocol','api_base','api_key']){const control=form.elements[name];const label=control?.closest('label');if(label)label.classList.remove('hidden');if(control){control.readOnly=inherited;if(name==='api_key')control.type=inherited?'text':'password'}}if(form.elements.api_key_env?.closest('label'))form.elements.api_key_env.closest('label').classList.add('hidden');document.querySelector('#modal-title').textContent=id?'编辑模型':'添加模型';document.querySelector('#modal').classList.remove('hidden')}
function editProvider(encoded){const provider=providers.find(item=>String(item.id)===decodeId(encoded));if(provider)openProviderForm(provider)}
function closeModal(){document.querySelector('#modal').classList.add('hidden')}
document.querySelector('#provider-form').onsubmit=async event=>{event.preventDefault();const form=event.target;const data=Object.fromEntries(new FormData(form));const id=data.id;delete data.id;data.enabled=true;data.is_default=form.is_default.checked;try{await api(id?'/api/providers/'+encodeURIComponent(id):'/api/providers',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});closeModal();await loadProviders();showNotice(id?'模型已更新':'模型已保存')}catch(error){showNotice(error.message)}};
async function loadSessions(){try{const q=new URLSearchParams();const search=document.querySelector('#search').value;if(search)q.set('search',search);const archived=document.querySelector('#archived').value;if(archived)q.set('archived',archived);sessions=await api('/api/sessions?'+q);document.querySelector('#session-count').textContent=`第 1 项起，共 ${sessions.length} 项`;document.querySelector('#sessions').innerHTML=sessions.map(s=>`<div class="session-item ${currentSession===s.id?'selected':''}" onclick="showSession('${idArg(s.id)}')"><main><div class="session-title">${esc(sessionTitle(s))}</div><div class="session-path">${esc(s.project)}</div></main><button class="link" onclick="event.stopPropagation();archiveSession('${idArg(s.id)}',${!s.archived})">${s.archived?'取消归档':'归档'}</button></div>`).join('')||'<div class="empty">暂无会话</div>'}catch(error){showNotice(error.message)}}
function sessionTitle(s){return s.title||'无标题会话'}
async function renameSession(encoded){const id=decodeId(encoded);const current=document.querySelector('#detail h2')?.textContent||'';const title=prompt('输入会话标题',current);if(title===null)return;const value=title.trim();if(!value){showNotice('标题不能为空');return}try{await api('/api/sessions/'+id+'/title',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:value})});await showSession(encoded)}catch(error){showNotice(error.message)}}
async function showSession(encoded){const id=decodeId(encoded);try{const s=await api('/api/sessions/'+id);currentSession=id;document.querySelector('#detail').innerHTML='';const head=document.createElement('div');head.className='detail-head';const title=document.createElement('h2');title.textContent=sessionTitle(s);const rename=document.createElement('button');rename.textContent='编辑标题';rename.onclick=()=>renameSession(encoded);head.append(title,rename);document.querySelector('#detail').append(head);const path=document.createElement('div');path.className='muted';path.textContent=s.project;document.querySelector('#detail').append(path);const command=document.createElement('div');command.className='command';const code=document.createElement('code');code.textContent=`aider --restore-chat-history --chat-history-file "${s.project}/.aider.chat.history.md"`;const copy=document.createElement('button');copy.textContent='复制';copy.onclick=()=>copyText(code.textContent);command.append(code,copy);document.querySelector('#detail').append(command);const message=document.createElement('div');message.className='message';const label=document.createElement('div');label.className='message-label';label.textContent='会话记录';const body=document.createElement('div');body.textContent=s.content||'';message.append(label,body);document.querySelector('#detail').append(message);loadSessions()}catch(error){showNotice(error.message)}}
async function archiveSession(encoded,value){try{await api('/api/sessions/'+decodeId(encoded)+'/archive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({archived:value})});await loadSessions()}catch(error){showNotice(error.message)}}
function copyText(value){navigator.clipboard?.writeText(value).then(()=>showNotice('已复制')).catch(()=>showNotice('复制失败，请手动复制'))}
loadProviders();
setupProviderForm();
setupProviderEditor();
</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aider 管理</title><style>
:root{color-scheme:dark;--bg:#0f1011;--panel:#1b1d1f;--panel2:#242629;--line:#303439;--text:#f3f4f6;--muted:#9ca3af;--cyan:#22d3ee;--green:#22c55e;--purple:#a78bfa;--red:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);background:#20262d;color:var(--text);border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{border-color:#59636e;background:#2b323a}button.primary{background:#f5f5f5;color:#111;border-color:#f5f5f5;font-weight:650}button.danger{color:var(--red)}button.link{border:0;background:transparent;color:var(--cyan);padding:4px 7px}input,select{background:#101214;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}input:focus,select:focus{outline:2px solid #155e75;border-color:var(--cyan)}
.app{display:flex;min-height:100vh}.side{width:248px;flex:none;padding:34px 18px;border-right:1px solid #25282b;background:#111213}.brand{font-size:29px;font-weight:750;letter-spacing:-.5px;margin:4px 14px 58px}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;text-align:left;color:var(--muted);font-size:17px;padding:15px 18px}.nav button.active{background:#292b2e;color:#fff}.nav-icon{display:inline-block;width:28px;color:var(--cyan)}
.main{min-width:0;flex:1}.topbar{height:92px;border-bottom:1px solid #25282b;padding:30px 38px;display:flex;align-items:center;justify-content:space-between}.topbar h1{margin:0;font-size:29px;font-weight:650}.topbar h1 small{font-size:13px;color:var(--muted);font-weight:400;margin-left:10px}.content{padding:24px 38px 56px;max-width:1440px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:24px}.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}.hidden{display:none!important}.notice{padding:12px 14px;border:1px solid #155e75;background:#082f3b;border-radius:8px;color:#a5f3fc;margin-bottom:16px}
.provider-card{background:var(--panel);border:1px solid #25282b;border-radius:14px;padding:22px 24px;margin:0 0 16px}.provider-head{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:18px}.provider-head h2{font-size:17px;margin:0}.provider-head .count{color:var(--muted)}.spacer{flex:1}.badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:6px;font-size:12px;background:#30264c;color:var(--purple)}.badge.green{background:#103b2a;color:#86efac}.badge.blue{background:#123a6a;color:#93c5fd}.badge.gray{background:#263039;color:#cbd5e1}.provider-info{display:grid;grid-template-columns:minmax(220px,1.8fr) minmax(170px,.8fr) minmax(180px,.8fr);gap:16px;padding:18px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field-value{background:#111315;border:1px solid #202327;border-radius:8px;padding:10px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.model-row{display:flex;align-items:center;gap:10px;border-top:1px solid #2a2d30;padding:17px 0}.model-name{font-weight:650;min-width:145px}.model-tags{display:flex;gap:6px;flex-wrap:wrap}.model-actions{display:flex;align-items:center;gap:7px;margin-left:auto}.model-actions button{padding:7px 10px;font-size:12px}.toggle{width:39px;height:22px;border-radius:20px;padding:2px;background:#374151;border:0}.toggle.on{background:var(--green)}.toggle i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}.toggle.on i{transform:translateX(17px)}.add-model{width:100%;border-style:dashed;background:transparent;color:var(--cyan);margin-top:5px}
.session-layout{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(420px,1.15fr);border:1px solid #25282b;border-radius:12px;overflow:hidden;min-height:560px}.session-list{background:#151719;padding:18px}.session-item{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid transparent;border-radius:10px;padding:15px;margin-bottom:10px;cursor:pointer}.session-item:hover,.session-item.selected{border-color:#0ea5a5}.session-item main{min-width:0;flex:1}.session-title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-path{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-detail{padding:28px;background:#111213;overflow:auto}.session-detail h2{margin:0 0 5px;font-size:23px}.detail-head{display:flex;align-items:flex-start;gap:12px}.detail-head h2{flex:1}.command{display:flex;gap:10px;align-items:flex-start;background:#202224;border:1px solid var(--line);border-radius:9px;padding:14px;margin:22px 0;white-space:pre-wrap;word-break:break-word}.command code{flex:1;color:#d1d5db}.message{background:var(--panel);border-radius:12px;padding:15px;margin:14px 0;white-space:pre-wrap;word-break:break-word}.message-label{color:var(--cyan);font-weight:650;margin-bottom:8px}.empty{padding:38px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px}.modal-card{width:min(560px,100%);background:#202224;border:1px solid var(--line);border-radius:12px;padding:24px}.form-grid{display:grid;gap:12px}.form-grid>label{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:12px;min-width:0}.form-grid>label>input:not([type="checkbox"]),.form-grid>label>select{width:100%;min-width:0}.form-grid>label:has(input[type="checkbox"]){display:flex;align-items:center;gap:8px}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
@media(max-width:900px){.side{width:190px}.content{padding:20px}.provider-info{grid-template-columns:1fr}.session-layout{grid-template-columns:1fr}.session-detail{min-height:400px}}@media(max-width:640px){.app{display:block}.side{width:auto;padding:14px;border-right:0;border-bottom:1px solid #25282b}.brand{margin:4px 8px 14px;font-size:24px}.nav{display:flex}.nav button{flex:1;padding:10px;font-size:14px}.topbar{height:auto;padding:20px;gap:12px}.topbar h1{font-size:23px}.content{padding:16px}.provider-card{padding:16px}.provider-head{flex-wrap:wrap}.model-row{align-items:flex-start;flex-wrap:wrap}.model-actions{margin-left:0;width:100%}.toolbar{align-items:flex-start;flex-direction:column}}
.session-view{--bg:#111;--panel:#212121;--line:#2c2c2c;--cyan:#00c9a4;background:var(--bg)}.session-view .side{width:24.5%;min-width:210px;background:#111;border-color:#242424;padding:26px 14px}.session-view .brand{font-size:30px;letter-spacing:1px;margin:0 10px 46px}.session-view .nav button{border:1px solid transparent;border-radius:10px;padding:15px 18px;font-size:16px}.session-view .nav button.active{background:#252527;border-color:#353538}.session-view .nav-icon{color:#8c939b}.session-view .nav button.active .nav-icon{color:var(--cyan)}.session-view .topbar{height:98px;padding:24px 34px;background:#111}.session-view .topbar h1{font-size:24px;font-weight:400}.session-view .topbar button{background:#202830;padding:11px 18px}.session-view #sessions-page{max-width:none;padding:0}.session-view .session-layout{grid-template-columns:minmax(300px,1fr) minmax(360px,1fr);border:0;border-radius:0;min-height:calc(100vh - 98px)}.session-view .session-list{padding:20px 18px;background:#111;border-right:1px solid #242424;min-width:0}.session-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.session-toolbar strong{font-weight:400;color:#9ca3af;white-space:nowrap}.session-filters{display:flex;align-items:center;gap:8px;min-width:0}.session-filters input{width:100%;padding:5px 8px;font-size:12px;min-width:70px;background:#111}.session-filters form{max-width:130px;min-width:0}.session-filters select{width:78px;padding:9px 8px;background:#252527;font-size:12px}.session-filters button{padding:9px 12px;background:#252527;white-space:nowrap}.session-list-row{display:flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:10px;background:#212121;padding:14px 12px;margin:0 0 9px;min-width:0}.session-list-row:hover{border-color:#454545}.session-list-row.selected{border-color:#00aa83}.session-select{display:flex;flex-direction:column;align-items:flex-start;gap:4px;flex:1;min-width:0;text-align:left;background:transparent;border:0;border-radius:0;padding:0;color:#eee}.session-select:hover{background:transparent}.session-select .session-title{font-size:15px;max-width:100%}.session-select .session-path{font-size:13px;max-width:100%}.session-row-actions{display:flex;align-items:center;gap:5px;flex:none}.session-icon{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;flex:none;border:0;border-radius:5px;background:transparent;color:#747e87;padding:6px}.session-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.session-icon:hover{color:#ddd;background:#303034}.session-title-form{display:flex;flex:1;gap:4px;min-width:0}.session-title-form input{width:100%;min-width:0;padding:6px}.session-title-form button{padding:5px 7px}.session-pager{display:flex;gap:8px;margin-top:16px}.session-pager button{font-size:12px;padding:7px 10px}.session-pager button:disabled{opacity:.35;cursor:default}.session-view .session-detail{min-width:0;padding:0;background:#111;overflow:visible}.session-detail-header{padding:28px 26px 24px;border-bottom:1px solid #242424}.session-view .session-detail h2{font-size:19px;font-weight:650;overflow-wrap:anywhere;margin-bottom:8px}.session-detail-header>.session-path{font-size:14px;margin:0;white-space:normal;overflow-wrap:anywhere}.session-detail-header .command{align-items:center;font-size:12px;margin:12px 0 8px;padding:12px;background:#212121;line-height:1.9}.session-detail-header .command code{min-width:0}.session-more-actions summary{cursor:pointer;color:#93999f;font-size:11px}.session-secondary-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.session-secondary-actions button{font-size:12px;padding:6px 9px}.session-history{padding:25px 26px}.session-message{margin:0 0 20px;max-width:86%;min-width:0}.session-message-user{margin-left:auto}.session-message-system{max-width:100%;color:#9ca3af}.session-message-heading{display:flex;align-items:center;gap:8px;color:#00c9a4;margin-bottom:8px}.session-message-heading strong{font-weight:400}.session-message-user .session-message-heading{justify-content:flex-end;color:#9ca3af}.session-message-heading .session-icon{background:#252527;width:25px;height:25px;padding:6px}.session-message-heading .session-icon svg{width:14px;height:14px}.session-message-bubble{margin:0;background:#212121;border:1px solid #252525;border-radius:14px;padding:15px 18px;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.8 system-ui,"Microsoft YaHei",sans-serif}.session-view #session-notice{margin:12px 18px}@media(max-width:1100px){.session-view .side{width:210px;min-width:210px}.session-view .session-layout{grid-template-columns:minmax(260px,1fr) minmax(300px,1fr)}.session-toolbar{flex-wrap:wrap}.session-filters{width:100%}.session-filters form{flex:1;max-width:none}}@media(max-width:800px){.session-view .session-layout{grid-template-columns:1fr}.session-view .session-list{border-right:0;border-bottom:1px solid #242424}.session-view .session-message{max-width:95%}}@media(max-width:640px){.session-view .side{width:100%;min-width:0;padding:14px}.session-view .brand{margin:0 8px 14px;font-size:24px}.session-view .topbar{height:auto;padding:20px}.session-view .session-detail-header,.session-view .session-history{padding:20px}.session-view .session-layout{min-height:0}}
.model-more{border-top:1px solid var(--line);padding-top:12px;margin-top:2px}.model-more summary{color:var(--muted);cursor:pointer;user-select:none}.model-more>.form-grid{margin-top:14px}.modal-card{max-height:90vh;overflow-y:auto}
</style></head><body><div class="app"><aside class="side"><div class="brand">Aider</div><nav class="nav"><button id="nav-models" class="active" onclick="showPage('models')"><span class="nav-icon">⚙</span>模型设置</button><button id="nav-sessions" onclick="showPage('sessions')"><span class="nav-icon">◌</span>会话管理</button></nav></aside><main class="main"><header class="topbar"><h1 id="page-title">模型列表<small id="page-subtitle">配置已加载</small></h1><div><button onclick="reloadPage()">↻ 重新加载</button><button class="primary" onclick="openProviderForm()">＋ 添加模型</button></div></header><section id="models-page" class="content"><div id="notice" class="notice hidden"></div><div class="toolbar"><div class="filters"><span class="muted">选择供应商：</span><select id="provider-filter" onchange="renderProviders()"><option value="">全部供应商</option></select></div><button class="primary" onclick="openProviderForm()">添加供应商</button></div><div id="providers"></div></section><section id="sessions-page" class="content hidden"><div class="toolbar"><div class="filters"><input id="search" placeholder="搜索会话" onkeydown="if(event.key==='Enter')loadSessions()"><button onclick="loadSessions()">搜索</button><select id="archived" onchange="loadSessions()"><option value="">全部</option><option value="false">未归档</option><option value="true">已归档</option></select></div><button onclick="loadSessions()">↻ 重新加载</button></div><div class="session-layout"><div class="session-list"><div id="session-count" class="muted" style="margin:0 0 14px">会话列表</div><div id="sessions"></div></div><article id="detail" class="session-detail"><div class="empty">选择一个会话查看详情</div></article></div></section></main></div><div id="modal" class="modal hidden"><div class="modal-card"><h2 id="modal-title">添加模型</h2><form id="provider-form" class="form-grid"><input type="hidden" name="id"><label>名称<input name="name" placeholder="Provider 名称" required></label><label>模型<input name="model" placeholder="模型 ID" required></label><label>API 协议<select name="protocol"><option value="openai-chat">OpenAI Chat Completions</option><option value="anthropic">Anthropic Messages</option><option value="openai-responses">OpenAI Responses</option></select></label><label>Base URL<input name="api_base" placeholder="https://api.example.com/v1"></label><label>API Key 环境变量<input name="api_key_env" placeholder="OPENAI_API_KEY"></label><label><input type="checkbox" name="is_default"> 设为默认模型</label><div class="form-actions"><button type="button" onclick="closeModal()">取消</button><button class="primary">保存</button></div></form></div></div>
<script>
const token='__AIDER_TOKEN__',headers={'Authorization':'Bearer '+token};let providers=[],sessions=[],currentSession=null,sessionPage=1,sessionHasNext=false;
function setupProviderForm(){const form=document.querySelector('#provider-form');form.elements.name?.closest('label')?.remove();document.querySelector('.toolbar > .primary')?.remove();const env=form.elements.api_key_env;env.parentElement.hidden=true;const key=document.createElement('input');key.type='password';key.name='api_key';key.placeholder='直接填写 API Key';key.autocomplete='new-password';const label=document.createElement('label');label.append('API Key',key);env.parentElement.after(label);setupModelAdvancedSettings(form)}
function setupModelAdvancedSettings(form){const more=document.createElement('details');more.id='model-more';more.className='model-more';more.innerHTML='<summary>更多设置</summary><div class="form-grid"><label>上下文窗口<input name="context_window" type="number" min="1" step="1" placeholder="默认 512000 tokens"></label><label>图片输入<select name="vision"><option value="">默认：支持图片</option><option value="true">支持</option><option value="false">不支持</option></select></label><label>思考强度<select name="reasoning_effort"><option value="">默认：中等（medium）</option><option value="low">low</option><option value="medium">中等（medium）</option><option value="high">high</option><option value="xhigh">xhigh</option><option value="max">max</option></select></label></div>';form.querySelector('.form-actions').before(more)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idArg=id=>encodeURIComponent(id),decodeId=id=>decodeURIComponent(id);const protocolName=p=>({"openai-chat":"OpenAI Chat","anthropic":"Anthropic Messages","openai-responses":"OpenAI Responses"}[p]||p);
async function api(url,options={}){const response=await fetch(url,{...options,headers:{...headers,...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||`HTTP ${response.status}`);return data}
function showNotice(message){const el=document.querySelector(document.querySelector('#models-page').classList.contains('hidden')?'#session-notice':'#notice');el.textContent=message;el.classList.remove('hidden');clearTimeout(el.noticeTimer);el.noticeTimer=setTimeout(()=>el.classList.add('hidden'),3500)}
function showPage(page){const models=page==='models';document.body.classList.toggle('session-view',!models);document.querySelector('#models-page').classList.toggle('hidden',!models);document.querySelector('#sessions-page').classList.toggle('hidden',models);document.querySelector('#nav-models').classList.toggle('active',models);document.querySelector('#nav-sessions').classList.toggle('active',!models);document.querySelector('#page-title').firstChild.textContent=models?'模型列表':'共享会话';document.querySelector('#page-subtitle').textContent=models?'配置已加载':'';document.querySelector('.topbar .primary').classList.toggle('hidden',!models);if(!models)loadSessions()}
function reloadPage(){if(document.querySelector('#models-page').classList.contains('hidden'))loadSessions();else loadProviders()}
async function loadProviders(){try{providers=await api('/api/providers');const filter=document.querySelector('#provider-filter');const value=filter.value;filter.innerHTML='<option value="">全部供应商</option>'+[...new Set(providers.map(p=>p.provider_id||p.name))].map(id=>`<option value="${esc(id)}">${esc(id)}</option>`).join('');filter.value=value;renderProviders()}catch(error){showNotice(error.message)}}
function renderProviders(){const filter=document.querySelector('#provider-filter').value;const visible=providers.filter(p=>!filter||(p.provider_id||p.name)===filter);const groups={};visible.forEach(p=>(groups[p.name]??=[]).push(p));const html=Object.entries(groups).map(([name,items])=>{const first=items[0];return `<section class="provider-card"><div class="provider-head"><div style="display:flex;align-items:center;gap:8px"><h2>${esc(name)}</h2><button class="link" style="font-size:18px;line-height:1;padding:3px 5px;color:#9ca3af" title="编辑供应商" aria-label="编辑供应商" onclick="openProviderEditor('${idArg(first.id)}')"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="m16 3 5 5-12 12-6 1 1-6Z"></path><path d="m14 5 5 5"></path></svg></button></div><span class="badge green">${items.some(p=>p.enabled!==false)?'已启用':'已禁用'}</span><span class="count">${items.length} 个模型</span><span class="spacer"></span></div>${items.map(renderModel).join('')}<button class="add-model" onclick="openProviderForm({source_provider_id:'${idArg(first.id)}'})">＋ 添加模型（当前供应商）</button></section>`}).join('');document.querySelector('#providers').innerHTML=html||'<div class="empty">暂无 Provider 配置</div>'}
function renderModel(p){const encoded=idArg(p.id);return `<div class="model-row"><div class="model-name">${esc(p.model)}</div><span class="badge">${esc(protocolName(p.protocol))}</span><div class="model-tags"><span class="badge blue">模型配置</span>${p.enabled===false?'<span class="badge gray">已禁用</span>':'<span class="badge green">已启用</span>'}</div><div class="model-actions"><button onclick="testProvider('${encoded}')">测试连接</button><button onclick="editProvider('${encoded}')">编辑</button><button class="danger" onclick="deleteProvider('${encoded}')">删除</button></div></div>`}
async function testProvider(encoded){try{const result=await api('/api/providers/'+decodeId(encoded)+'/test',{method:'POST'});showNotice(result.ok?'连接成功':'连接失败：'+(result.error||'未知错误'))}catch(error){showNotice(error.message)}}
async function deleteProvider(encoded){if(!confirm('确定删除这个 Provider 吗？'))return;try{await api('/api/providers/'+decodeId(encoded),{method:'DELETE'});await loadProviders()}catch(error){showNotice(error.message)}}
function setupProviderEditor(){const modal=document.createElement('div');modal.id='provider-edit-modal';modal.className='modal hidden';modal.innerHTML='<div class="modal-card"><h2>编辑供应商</h2><p class="muted">修改此供应商下模型共用的配置</p><form id="provider-edit-form" class="form-grid"><input type="hidden" name="group"><label>供应商名称<input name="name" required placeholder="例如 my-api"></label><label>Base URL<input name="api_base" placeholder="https://api.example.com/v1"></label><label>API 协议<select name="protocol"><option value="openai-chat">OpenAI Chat Completions</option><option value="anthropic">Anthropic Messages</option><option value="openai-responses">OpenAI Responses</option></select></label><label>API Key<input type="password" name="api_key" autocomplete="new-password" placeholder="已配置，留空则保持不变"></label><div class="form-actions"><button type="button" onclick="closeProviderEditor()">取消</button><button class="primary">保存供应商</button></div></form></div>';document.body.append(modal);modal.querySelector('form').onsubmit=saveProviderEditor}
function openProviderEditor(encoded){const provider=providers.find(item=>String(item.id)===decodeId(encoded));if(!provider)return;const form=document.querySelector('#provider-edit-form');form.reset();form.elements.group.value=provider.name||'';form.elements.name.value=provider.name||'';form.elements.api_base.value=provider.api_base||'';form.elements.protocol.value=provider.protocol||'openai-chat';form.elements.api_key.value='';document.querySelector('#provider-edit-modal').classList.remove('hidden')}
function closeProviderEditor(){document.querySelector('#provider-edit-modal').classList.add('hidden')}
async function saveProviderEditor(event){event.preventDefault();const form=event.target;const current=form.elements.group.value;const name=form.elements.name.value.trim();if(!name){showNotice('供应商名称不能为空');return}const targets=providers.filter(item=>item.name===current);if(!targets.length){showNotice('供应商不存在');return}const data={name,api_base:form.elements.api_base.value.trim()||null,protocol:form.elements.protocol.value};const apiKey=form.elements.api_key.value.trim();if(apiKey)data.api_key=apiKey;try{await Promise.all(targets.map(item=>api('/api/providers/'+encodeURIComponent(item.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})));closeProviderEditor();await loadProviders();showNotice('供应商信息已更新')}catch(error){showNotice(error.message)}}
function openProviderForm(value={}){const form=document.querySelector('#provider-form');form.reset();document.querySelector('#model-more').open=false;const defaults={context_window:512000,vision:true,reasoning_effort:'medium'};for(const name of ['context_window','vision','reasoning_effort'])form.elements[name].value=String(value[name]??defaults[name]);let sourceInput=form.elements.source_provider_id;if(!sourceInput){sourceInput=document.createElement('input');sourceInput.type='hidden';sourceInput.name='source_provider_id';form.prepend(sourceInput)}const id=value.id||'';const sourceId=value.source_provider_id?decodeId(value.source_provider_id):'';const source=sourceId?providers.find(item=>String(item.id)===sourceId):null;sourceInput.value=sourceId;document.querySelector('[name=id]').value=id;for(const name of ['model','protocol','api_base','api_key_env'])if(value[name]!=null&&form.elements[name])form.elements[name].value=value[name];if(source&&!id){form.elements.protocol.value=source.protocol||'openai-chat';form.elements.api_base.value=source.api_base||'';form.elements.api_key_env.value=source.api_key_env||'';if(form.elements.api_key)form.elements.api_key.value=source.has_api_key?(source.has_api_key_env&&source.api_key_env?'环境变量：'+source.api_key_env:'已配置 · 不回显'):'未配置'}else if(form.elements.api_key)form.elements.api_key.value='';form.elements.is_default.checked=!!value.is_default;const inherited=!!source&&!id;for(const name of ['protocol','api_base','api_key']){const control=form.elements[name];const label=control?.closest('label');if(label)label.classList.remove('hidden');if(control){control.readOnly=inherited;if(name==='api_key')control.type=inherited?'text':'password'}}if(form.elements.api_key_env?.closest('label'))form.elements.api_key_env.closest('label').classList.add('hidden');document.querySelector('#modal-title').textContent=id?'编辑模型':'添加模型';document.querySelector('#modal').classList.remove('hidden')}
function editProvider(encoded){const provider=providers.find(item=>String(item.id)===decodeId(encoded));if(provider)openProviderForm(provider)}
function closeModal(){document.querySelector('#modal').classList.add('hidden')}
document.querySelector('#provider-form').onsubmit=async event=>{event.preventDefault();const form=event.target;const data=Object.fromEntries(new FormData(form));const id=data.id;delete data.id;data.enabled=true;data.is_default=form.is_default.checked;try{await api(id?'/api/providers/'+encodeURIComponent(id):'/api/providers',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});closeModal();await loadProviders();showNotice(id?'模型已更新':'模型已保存')}catch(error){showNotice(error.message)}};
const sessionIcons={edit:'<path d="m16 3 5 5-12 12-6 1 1-6Z"/><path d="m14 5 5 5"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h4"/>',archive:'<rect x="3" y="3" width="18" height="4" rx="1"/><path d="M5 7v14h14V7M9 11h6"/>',delete:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/>'};
function sessionIcon(name){return `<svg viewBox="0 0 24 24" aria-hidden="true">${sessionIcons[name]}</svg>`}
function sessionNode(tag,text,className){const el=document.createElement(tag);if(text!=null)el.textContent=text;if(className)el.className=className;return el}
function sessionButton(label,action,icon){const el=sessionNode('button',icon?null:label,icon?'session-icon':'');el.type='button';el.title=label;el.setAttribute('aria-label',label);if(icon)el.innerHTML=sessionIcon(icon);el.onclick=action;return el}
function setupSessionPage(){const page=document.querySelector('#sessions-page');page.querySelector('.toolbar').remove();const notice=sessionNode('div',null,'notice hidden');notice.id='session-notice';notice.setAttribute('role','status');page.prepend(notice);const pane=page.querySelector('.session-list');const toolbar=sessionNode('div',null,'session-toolbar');toolbar.innerHTML='<strong>会话列表</strong><div class="session-filters"><form id="session-search-form"><input id="search" maxlength="200" aria-label="搜索标题或目录" placeholder="搜索会话"></form><button id="session-search-toggle" type="button" aria-expanded="true" aria-controls="session-search-form">搜索</button><select id="archived" aria-label="会话排列方式"><option value="">全部</option><option value="project">按项目</option><option value="title">按标题</option><option value="true">归档</option></select></div>';pane.prepend(toolbar);document.querySelector('#session-search-form').onsubmit=event=>{event.preventDefault();sessionPage=1;loadSessions()};document.querySelector('#archived').onchange=()=>{sessionPage=1;loadSessions()};document.querySelector('#session-search-toggle').onclick=()=>document.querySelector('#session-search-form').requestSubmit();const hint=sessionNode('p','按最近会话排序','muted');hint.id='session-view-hint';toolbar.after(hint);const pager=sessionNode('div',null,'session-pager');const previous=sessionButton('上一页',()=>{sessionPage--;loadSessions()});previous.id='session-prev';const next=sessionButton('下一页',()=>{sessionPage++;loadSessions()});next.id='session-next';pager.append(previous,next);pane.append(pager)}
async function loadSessions(){try{const q=new URLSearchParams({page:String(sessionPage),page_size:'50',include_total:'true'});const search=document.querySelector('#search').value.trim();if(search)q.set('search',search);const view=document.querySelector('#archived').value;if(view==='true')q.set('archived','true');if(view==='project'||view==='title')q.set('sort',view);document.querySelector('#session-view-hint').textContent={project:'按项目排列',title:'按标题排列',true:'已归档会话'}[view]||'按最近会话排序';const result=await api('/api/sessions?'+q);const items=result.sessions;if(!items.length&&sessionPage>1){sessionPage--;return loadSessions()}sessions=items;sessionHasNext=sessionPage*50<result.total;document.querySelector('#session-count').textContent=items.length?`第 ${(sessionPage-1)*50+1} 项起，共 ${result.total} 项`:'共 0 项';document.querySelector('#session-prev').disabled=sessionPage===1;document.querySelector('#session-next').disabled=!sessionHasNext;renderSessions()}catch(error){showNotice(error.message)}}
function renderSessions(){const list=document.querySelector('#sessions');list.replaceChildren();for(const s of sessions){const row=sessionNode('div',null,'session-list-row'+(currentSession===s.id?' selected':''));row.dataset.sessionId=s.id;const select=sessionButton(sessionTitle(s),()=>showSession(idArg(s.id)));select.replaceChildren();select.className='session-select';select.setAttribute('aria-pressed',String(currentSession===s.id));select.append(sessionNode('span',sessionTitle(s),'session-title'),sessionNode('small',s.project,'session-path'));const actions=sessionNode('div',null,'session-row-actions');actions.append(sessionButton('编辑标题',()=>renameSession(idArg(s.id)),'edit'),sessionButton('删除会话',()=>deleteSession(idArg(s.id)),'delete'));row.append(select,actions);list.append(row)}if(!sessions.length)list.append(sessionNode('div','暂无会话','empty'))}
function sessionTitle(s){return s.title||'无标题会话'}
function renameSession(encoded){const id=decodeId(encoded),s=sessions.find(item=>item.id===id);if(!s)return;const row=[...document.querySelectorAll('.session-list-row')].find(item=>item.dataset.sessionId===id);if(!row||row.querySelector('form'))return;const form=sessionNode('form',null,'session-title-form');const input=sessionNode('input');input.value=sessionTitle(s);input.maxLength=200;input.setAttribute('aria-label','会话标题');const save=sessionButton('保存标题',()=>form.requestSubmit());save.textContent='✓';const cancel=sessionButton('取消编辑',renderSessions);cancel.textContent='×';form.append(input,save,cancel);row.querySelector('.session-select').replaceWith(form);form.onsubmit=async event=>{event.preventDefault();const title=input.value.trim();if(!title){showNotice('标题不能为空');return}save.disabled=true;try{await api('/api/sessions/'+encodeURIComponent(id)+'/title',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});s.title=title;renderSessions();if(currentSession===id)document.querySelector('#detail h2').textContent=title;showNotice('标题已保存')}catch(error){showNotice(error.message);save.disabled=false}};input.onkeydown=event=>{if(event.key==='Escape'){event.preventDefault();renderSessions()}};input.focus();input.select()}
async function deleteSession(encoded){const id=decodeId(encoded);try{await api('/api/sessions/'+encodeURIComponent(id),{method:'DELETE'});if(currentSession===id){currentSession=null;document.querySelector('#detail').replaceChildren(sessionNode('div','选择一个会话查看详情','empty'))}await loadSessions()}catch(error){showNotice(error.message)}}
async function showSession(encoded){const id=decodeId(encoded);currentSession=id;renderSessions();try{const s=await api('/api/sessions/'+encodeURIComponent(id));if(currentSession!==id)return;const detail=document.querySelector('#detail');detail.replaceChildren();const head=sessionNode('header',null,'session-detail-header');head.append(sessionNode('h2',sessionTitle(s)),sessionNode('p',s.project,'session-path'));const command=sessionNode('div',null,'command');const code=sessionNode('code',s.restore_command);const copy=sessionButton('复制恢复命令',async()=>{try{const result=await api('/api/sessions/'+encodeURIComponent(id)+'/restore',{method:'POST'});await copyText(result.command)}catch(error){showNotice(error.message)}},'copy');command.append(code,copy);head.append(command);const more=sessionNode('details',null,'session-more-actions');more.append(sessionNode('summary','更多操作'));const actions=sessionNode('div',null,'session-secondary-actions');const messages=s.messages||[];actions.append(sessionButton(s.archived?'取消归档':'归档',()=>archiveSession(encoded,!s.archived)),sessionButton('复制会话 ID',()=>copyText(s.id)),sessionButton('复制已加载对话',()=>copyText(messages.map(m=>`${messageRole(m.role)}\n${m.content}`).join('\n\n'))),sessionButton('删除会话',()=>deleteSession(encoded)));more.append(actions);head.append(more);detail.append(head);const history=sessionNode('div',null,'session-history');for(const m of messages){const article=sessionNode('article',null,'session-message session-message-'+m.role);const heading=sessionNode('div',null,'session-message-heading');heading.append(sessionNode('strong',messageRole(m.role)),sessionButton('复制正文',()=>copyText(m.content),'copy'));const body=sessionNode('pre',m.content,'session-message-bubble');article.append(heading,body);history.append(article)}if(!messages.length)history.append(sessionNode('div','暂无对话内容','empty'));detail.append(history)}catch(error){if(currentSession===id)showNotice(error.message)}}
function messageRole(role){return {user:'用户',assistant:'助手',system:'系统',tool:'工具'}[role]||role}
async function archiveSession(encoded,value){const id=decodeId(encoded);try{await api('/api/sessions/'+encodeURIComponent(id)+'/archive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({archived:value})});await loadSessions();if(currentSession===id)await showSession(encoded);showNotice(value?'会话已归档':'已取消归档')}catch(error){showNotice(error.message)}}
async function copyText(value){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(String(value))}else{const area=sessionNode('textarea',String(value));area.style.cssText='position:fixed;opacity:0;left:0;top:0';document.body.append(area);area.select();const copied=document.execCommand('copy');area.remove();if(!copied)throw Error('复制失败')}showNotice('已复制')}catch(error){showNotice('复制失败，请手动复制')}}
setupSessionPage();
loadProviders();
setupProviderForm();
setupProviderEditor();
</script></body></html>
